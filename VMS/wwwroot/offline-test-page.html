<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>VMS — Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
        }

        .card {
            max-width: 540px;
            border: 1px solid #ddd;
            padding: 1.25rem;
            border-radius: 12px;
        }

        h1 {
            margin: 0 0 .5rem;
        }

        p {
            margin: .25rem 0;
        }

        code {
            background: #f5f5f5;
            padding: .2rem .4rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>The VMS app is cached, but the requested page requires a connection.</p>
        <p>Try again once you’re back online.</p>
        <p><small>Tip: Turn off <code>Offline</code> in DevTools → Network.</small></p>
    </div>
</body>
</html>
